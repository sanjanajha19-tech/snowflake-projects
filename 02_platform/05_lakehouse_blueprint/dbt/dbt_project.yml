# dbt project mirroring the SILVER / GOLD layers of the lakehouse blueprint.
# Works with dbt Projects on Snowflake (Workspaces / snow dbt deploy) and dbt Core.
name: accel_lakehouse
version: "1.0.0"
config-version: 2
profile: accel_lakehouse

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  accel_lakehouse:
    silver:
      +materialized: view
      +tags: ["silver"]
    gold:
      +materialized: table
      +tags: ["gold"]
